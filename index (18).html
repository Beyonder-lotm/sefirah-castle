<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">

<title>Sefirah Castle – Le Club du Tarot</title>

<style>
:root{--ink:#e9e6f2;--mute:#8d8aa3;--bg:#06070d;--glass:#ffffff09;--line:#ffffff18;--blood:#c8203c;--gold:#e8c06a;--gold2:#fbe6b0;--fog:#9b9fb5;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--ink);background:var(--bg);font:400 15px/1.55 Sora,system-ui,sans-serif;overflow-x:hidden}
#bg{position:fixed;inset:0;z-index:-3}#bg svg{width:100%;height:100%}

.wrap{max-width:1100px;margin:0 auto;padding:10px 16px 90px}
header{text-align:center;padding:34px 0 4px}
.sig{display:inline-flex;width:54px;height:54px;border-radius:50%;align-items:center;justify-content:center;border:1px solid #e8c06a88;font:900 22px Cinzel,serif;color:var(--gold);box-shadow:0 0 40px #c8203c66,inset 0 0 18px #e8c06a33;background:radial-gradient(circle,#c8203c33,transparent 70%)}
h1{margin:14px 0 0;font:900 clamp(30px,7.4vw,66px)/1.05 Cinzel,serif;letter-spacing:.16em;background:linear-gradient(180deg,#fff 10%,var(--gold) 55%,#b8862e);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 6px 30px #c8203c55)}

nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;gap:7px;justify-content:center;align-items:center;flex-wrap:wrap;margin:22px auto 0;padding:10px;max-width:fit-content;border-radius:22px;background:#0b0c16aa;border:1px solid var(--line);backdrop-filter:blur(16px)}

.act{font:600 13px Sora,sans-serif;color:var(--ink);background:var(--glass);border:1px solid var(--line);padding:11px 22px;border-radius:12px;transition:.2s}

#draw{text-align:center}

.row{display:flex;gap:26px;justify-content:center;flex-wrap:wrap;margin:22px 0 30px;min-height:330px}

.card{width:204px;aspect-ratio:2/3;perspective:1100px;border:0;background:none;padding:0;position:relative;transform:perspective(900px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .15s ease-out}

.back b{position:relative;z-index:1;font:900 54px Cinzel,serif;background:linear-gradient(#fff,var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 16px #e8c06a88)}

.face{transform:rotateY(180deg);background:#080911;box-shadow:inset 0 0 0 1.5px var(--rc),inset 0 0 0 6px #080911,inset 0 0 0 7px color-mix(in srgb,var(--rc) 55%,transparent),0 18px 44px #000c}

.card[data-r=l] .face::before,.card[data-r=m] .face::before{animation:sweep 3.4s ease-in-out infinite}

.arch{position:absolute;inset:9px 9px 62px;border-radius:90px 90px 8px 8px;overflow:hidden;background:radial-gradient(circle at 50% 36%,var(--rg),#07080f 88%) center/cover;box-shadow:0 0 0 1px color-mix(in srgb,var(--rc) 70%,transparent)}

.num{position:absolute;top:14px;left:0;right:0;text-align:center;z-index:2;font:700 10px Cinzel,serif;color:#fff;opacity:.85;letter-spacing:.3em;text-shadow:0 1px 8px #000}
.plate{position:absolute;left:9px;right:9px;bottom:9px;height:56px;z-index:2;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;border-radius:6px 6px 10px 10px;background:linear-gradient(#0d0e1a,#06070d);border:1px solid color-mix(in srgb,var(--rc) 60%,transparent);padding:0 6px}
.nm{font:700 12.5px/1.1 Cinzel,serif;color:#fff;letter-spacing:.03em}
.ds{font:italic 500 11.5px 'Cormorant Garamond',serif;color:#c9c7dc;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.seq{position:absolute;top:30px;left:50%;transform:translateX(-50%);z-index:2;font:700 8.5px Sora,sans-serif;letter-spacing:.06em;color:#0a0a12;background:var(--rc);padding:2px 10px;border-radius:999px;white-space:nowrap;max-width:88%;overflow:hidden;text-overflow:ellipsis}
.face.new::after{content:"Nouvelle";position:absolute;top:60px;right:14px;z-index:5;background:var(--blood);color:#fff;font:700 9px Sora,sans-serif;padding:2px 8px;border-radius:999px;box-shadow:0 0 14px #c8203c}
.shine{position:absolute;inset:0;z-index:3;pointer-events:none;opacity:0;transition:opacity .2s;background:radial-gradient(circle at var(--mx,50%) var(--my,50%),#ffffff44,#fff0 42%)}
.card:hover .shine{opacity:1}
.card[data-r=e] .shine,.card[data-r=l] .shine,.card[data-r=m] .shine{background:radial-gradient(circle at var(--mx,50%) var(--my,50%),#ffffff3a,#fff0 40%),linear-gradient(115deg,#0000 18%,#ff3dd248 33%,#3dffe848 50%,#ffe03d48 66%,#0000 82%);background-size:100% 100%,260% 260%;background-position:0 0,var(--mx,50%) var(--my,50%);mix-blend-mode:screen}
.card[data-r=l] .face{box-shadow:inset 0 0 0 1.5px var(--rc),inset 0 0 0 6px #080911,inset 0 0 0 7px #e0ac4588,0 0 34px #e8c06a44,0 18px 44px #000c}

.bar{flex:0 1 320px;height:7px;background:#ffffff12;border-radius:999px;overflow:hidden}

.panel{background:var(--glass);border:1px solid var(--line);border-radius:18px;backdrop-filter:blur(14px);padding:18px 20px;margin:18px 0}

.lot{display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap;border-left:3px solid var(--rc);background:#ffffff07;border-radius:10px;padding:8px 14px;margin:8px 0;font-size:13px}
.lot i{color:var(--mute);font-size:11px;font-style:normal}
.lot button{font:600 12px Sora,sans-serif;background:#e8c06a16;border:1px solid #e8c06a66;padding:5px 12px;border-radius:8px;color:var(--gold)}
.mute{color:var(--mute)}.hide{display:none}
.foot{text-align:center;margin-top:44px}

.foot button:not(.act){background:none;border:0;color:var(--mute);text-decoration:underline;font-size:12px}
dialog{background:#0e0f1a;border:1px solid var(--line);border-radius:20px;color:var(--ink);padding:24px;text-align:center;max-width:94vw}
dialog::backdrop{background:#000d;backdrop-filter:blur(6px)}
dialog .card{width:min(290px,70vw);margin:0 auto 20px;cursor:default}
.ds.s{font:600 8.5px Sora,sans-serif;letter-spacing:.02em;color:#d9d6ea;font-style:normal}.lv{position:absolute;top:9px;right:13px;z-index:3;font:700 9px Sora,sans-serif;color:var(--gold);text-shadow:0 0 6px #000}#ddet{max-width:300px;margin:0 auto 16px;font-size:13px}#ddet p{margin:6px 0}#pity b{color:var(--gold)}
.fx{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;pointer-events:none;background:radial-gradient(circle,#e0ac4577,#000c 70%);animation:fxo 1.7s ease-out forwards}.fx.m{background:radial-gradient(circle,#d0334acc,#000e 70%);animation-duration:2.3s}.fx i{position:absolute;width:140vmax;height:140vmax;border-radius:50%;background:repeating-conic-gradient(#ffe0a133 0 6deg,transparent 6deg 20deg);-webkit-mask:radial-gradient(circle,#000,transparent 60%);mask:radial-gradient(circle,#000,transparent 60%);animation:fxr 2.3s linear}.fx.m i{background:repeating-conic-gradient(#ff3d5a44 0 6deg,transparent 6deg 20deg)}.fx span{position:relative;font:900 clamp(26px,8vw,64px) Cinzel,serif;letter-spacing:.2em;color:var(--gold2);text-shadow:0 0 40px #e0ac45;animation:fxs 1.2s cubic-bezier(.2,1.4,.3,1)}.fx.m span{color:#ffd0d6;text-shadow:0 0 50px #d0334a}@keyframes fxo{0%{opacity:0}12%{opacity:1}75%{opacity:1}100%{opacity:0}}@keyframes fxr{to{transform:rotate(90deg)}}@keyframes fxs{from{transform:scale(.3);opacity:0;letter-spacing:.6em}}
.row.multi{min-height:0;gap:12px}.multi .card{width:112px}.multi .nm{font-size:9px}.multi .ds.s{font-size:7px}.multi .plate{height:44px}.multi .arch{bottom:48px}.row.moon1 .back{box-shadow:inset 0 0 0 1px #e8c06a,0 0 36px #e8c06a77}.row.moon2 .back{box-shadow:inset 0 0 0 1px #ff3d5a,0 0 44px #d0334acc}.bm{font-family:Cinzel,serif;color:#ff6b83;text-shadow:0 0 18px #d0334a}.bf{font-family:Cinzel,serif;color:var(--gold2);text-shadow:0 0 18px #e0ac45}
.arena{display:flex;align-items:flex-start;justify-content:center;gap:12px;margin:18px 0}.side{display:flex;flex-direction:column;align-items:center;gap:8px;width:min(150px,38vw)}.arena .card{width:min(140px,36vw)}.arena .fcard{animation:enter .5s cubic-bezier(.2,.8,.2,1)}@keyframes enter{from{opacity:0;transform:translateY(40px) scale(.8)}}.vs{font:900 22px Cinzel,serif;color:var(--blood);text-shadow:0 0 20px #c8203c;align-self:center}.hb{width:100%;height:8px;background:#ffffff14;border-radius:99px;overflow:hidden}.hb i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#d0334a,#e8c06a);transition:width .35s}.hv{font:600 11px Sora,sans-serif;color:var(--mute)}.tm{display:flex;gap:4px;flex-wrap:wrap;justify-content:center;min-height:22px}.pp{font:600 9px Sora,sans-serif;padding:2px 7px;border-radius:99px;background:#ffffff0d;color:var(--mute)}.pp.on{color:var(--gold);outline:1px solid #e8c06a88}.pp.dead{text-decoration:line-through;opacity:.4}.fc{position:relative;min-height:min(210px,54vw)}.fl{position:absolute;left:50%;top:30%;z-index:9;font:900 24px Cinzel,serif;pointer-events:none;white-space:nowrap;animation:fl .9s ease-out forwards;text-shadow:0 2px 10px #000}.fl.ht{color:#ff5470}.fl.hl{color:#6ff0a0}.fl.ms{color:#cfd3ff;font-size:17px}.fl.cr{color:#ffd45c;font-size:30px}@keyframes fl{from{transform:translate(-50%,0) scale(.6)}to{transform:translate(-50%,-70px) scale(1.2);opacity:0}}.fres{text-align:center;font:900 clamp(28px,7vw,52px) Cinzel,serif;letter-spacing:.2em;animation:fxs 1s}.fres.w{color:var(--gold2);text-shadow:0 0 36px #e8c06a}.fres.l{color:#ff6b83;text-shadow:0 0 36px #d0334a}
.boost{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;margin:22px 0 30px;min-height:300px;cursor:pointer}
.bp{position:relative;width:170px;aspect-ratio:2/3.3;animation:bfl 3s ease-in-out infinite alternate;filter:drop-shadow(0 16px 28px #000b);transition:transform .2s}

.bb small{font:700 11px Cinzel,serif;letter-spacing:.35em;color:var(--gold2)}

let bi=0;
const pendNow=()=>window.packPending&&window.packPending();
function bdraw(dir){
  const b=BS[bi],v=$('bview');if(!v)return;
  const g=BTHG[b.k];
  v.innerHTML=`<div class="bp${b.k!=='n'?' bth-'+b.k:''}"><div class="bt"></div><div class="bb"><span>${g[0]}</span><small>${g[1]}</small></div></div><div class="bi"><b>${b.t}</b><p>${b.d}</p><div class="bpx">${b.px()}</div></div>`;
  if(dir){v.style.setProperty('--d',dir*24+'px');v.classList.remove('sw');void v.offsetWidth;v.classList.add('sw')}
  $('bdots').innerHTML=BS.map((x,j)=>`<button data-bi="${j}" aria-label="${x.t}" aria-current="${j===bi}"></button>`).join('');
  const n=b.k==='n';
  ['open','o5','o10','buy'].forEach(id=>{const e=$(id);if(e)e.style.display=n?'':'none'});
  $('abuy').style.display=b.k==='a'?'':'none';$('lbuy').style.display=b.k==='l'?'':'none';
  $('abuy').textContent='Ouvrir : artefacts ('+APRICE+' £)';$('lbuy').textContent='Ouvrir : lieux ('+LPRICE+' £)';
  tick();
}
function bgo(d){bi=(bi+d+BS.length)%BS.length;bdraw(d)}
$('bprev').onclick=()=>bgo(-1);$('bnext').onclick=()=>bgo(1);
$('bdots').addEventListener('click',e=>{const j=e.target.dataset&&e.target.dataset.bi;if(j===undefined)return;const d=+j>bi?1:-1;bi=+j;bdraw(d)});
let tx=null;const bc=$('bcar');
bc.addEventListener('touchstart',e=>{tx=e.touches[0].clientX},{passive:true});
bc.addEventListener('touchend',e=>{if(tx===null)return;const dx=e.changedTouches[0].clientX-tx;tx=null;if(Math.abs(dx)>40)bgo(dx<0?1:-1)},{passive:true});
bc.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')bgo(-1);else if(e.key==='ArrowRight')bgo(1)});
// Artefacts / lieux : paquet scellé thématique
const _oa=openArt;openArt=function(){if(sealed){const b=$('boost');if(b)b.remove();$('pack').style.display='';sealed=null}RPD=0;_oa.apply(this,arguments);if(RPD)sealIt(1,0,'a')};
const _ol=openLieu;openLieu=function(){if(pendNow())return msg('Révèle d’abord les cartes de ton booster (touche-les ou « Tout révéler »).');if(sealed){const b=$('boost');if(b)b.remove();$('pack').style.display='';sealed=null}RPD=0;_ol.apply(this,arguments);if(RPD)sealIt(1,0,'l')};
$('abuy').onclick=openArt;$('lbuy').onclick=openLieu;
const _t3=tick;tick=function(){_t3.apply(this,arguments);const b=$('lbuy');if(b)b.disabled=pendNow()||S.gold<LPRICE};
bdraw(0);

/* ===== Vendre depuis la fiche ===== */
const _od=openDlg;openDlg=function(i){_od(i);const own=S.own[i]>0;$('dsell').style.display=own?'':'none';$('dsw').innerHTML=''};
$('dsell').onclick=()=>{
  const i=cur,n=S.own[i]||0;if(!n)return;const w=$('dsw');
  if(w.firstChild){w.innerHTML='';return}
  w.innerHTML=`<div class="panel"><b>Vendre ${esc(CARDS[i][0])}</b> <span class="mute">· tu en as ×${n}</span>
<p class="btns"><select id="dsm" aria-label="Type"><option value="fixed">Prix fixe</option><option value="auction">Enchère</option></select>
<input id="dsp" type="number" min="1" value="${cardVal(i)}" aria-label="Prix en livres" title="Prix de chaque carte"> £
<input id="dsn" type="number" min="1" max="${n}" value="1" aria-label="Copies à vendre" title="Nombre de copies">
<select id="dsd" aria-label="Durée" style="display:none"><option value="2">2 min</option><option value="60" selected>1 h</option><option value="360">6 h</option><option value="1440">24 h</option></select></p>
<p class="btns"><button class="act" id="dsgo">Mettre en vente</button></p>
<p class="mute">Valeur du jour : ${cardVal(i)} £. Pour un échange, passe par l’onglet Marché.</p></div>`;
  $('dsm').onchange=()=>{$('dsd').style.display=$('dsm').value==='auction'?'':'none'};
  $('dsgo').onclick=()=>{
    const q=Math.max(1,Math.min(S.own[i]||0,parseInt($('dsn').value)||1)),p=Math.max(1,parseInt($('dsp').value)||1);
    if(!S.own[i])return;
    if(q>=S.own[i]&&!(S.fav&&S.fav[i])&&!confirm('Tu vends ton dernier exemplaire de '+CARDS[i][0]+'. Continuer ?'))return;
    LF.c={};LF.c[i]=1;LF.m=$('dsm').value;LF.p=p;LF.n=q;LF.d=$('dsd').value;
    const before=S.own[i]||0;listIt();LF.c={};
    if((S.own[i]||0)<before){if(S.own[i]>0)openDlg(i);else $('dlg').close();try{renderCol()}catch(e){}}
  };
};
})();
save();setInterval(tick,1000);tick();
</script>
</body>
</html>
