<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sefirah Castle – Le Club du Tarot</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Cormorant+Garamond:ital,wght@0,500;0,700;1,500&family=Sora:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#e9e6f2;--mute:#8d8aa3;--bg:#06070d;--glass:#ffffff09;--line:#ffffff18;--blood:#c8203c;--gold:#e8c06a;--gold2:#fbe6b0;--fog:#9b9fb5;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--ink);background:var(--bg);font:400 15px/1.55 Sora,system-ui,sans-serif;overflow-x:hidden}
#bg{position:fixed;inset:0;z-index:-3}#bg svg{width:100%;height:100%}
#fan{position:absolute;inset:0;background:center/cover;opacity:.5}
.fog{position:fixed;inset:-25%;z-index:-2;pointer-events:none;background:radial-gradient(35% 22% at 25% 35%,#8a8fa844,transparent 70%),radial-gradient(40% 25% at 78% 55%,#7a7f9840,transparent 70%),radial-gradient(55% 25% at 50% 92%,#9a9fb83a,transparent 70%);animation:drift 38s ease-in-out infinite alternate}
.fog.b{animation-duration:55s;animation-direction:alternate-reverse;opacity:.7;filter:blur(20px)}
@keyframes drift{to{transform:translate(7%,3%) scale(1.15)}}
body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(120% 90% at 50% 30%,transparent 30%,#04050bdd 100%)}
.wrap{max-width:1100px;margin:0 auto;padding:10px 16px 90px}
header{text-align:center;padding:34px 0 4px}
.sig{display:inline-flex;width:54px;height:54px;border-radius:50%;align-items:center;justify-content:center;border:1px solid #e8c06a88;font:900 22px Cinzel,serif;color:var(--gold);box-shadow:0 0 40px #c8203c66,inset 0 0 18px #e8c06a33;background:radial-gradient(circle,#c8203c33,transparent 70%)}
h1{margin:14px 0 0;font:900 clamp(30px,7.4vw,66px)/1.05 Cinzel,serif;letter-spacing:.16em;background:linear-gradient(180deg,#fff 10%,var(--gold) 55%,#b8862e);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 6px 30px #c8203c55)}
.sub{font:italic 500 clamp(16px,3.6vw,21px) 'Cormorant Garamond',serif;color:var(--fog);margin:10px 0 0;letter-spacing:.04em}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;gap:7px;justify-content:center;align-items:center;flex-wrap:wrap;margin:22px auto 0;padding:10px;max-width:fit-content;border-radius:22px;background:#0b0c16aa;border:1px solid var(--line);backdrop-filter:blur(16px)}
button{font:inherit;cursor:pointer;color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
nav button{font:600 13px Sora,sans-serif;color:var(--mute);background:transparent;border:1px solid transparent;padding:8px 15px;border-radius:999px;transition:.2s}
nav button:hover{color:var(--ink)}
nav button[aria-pressed=true]{color:#1a0c04;background:linear-gradient(120deg,var(--gold2),var(--gold));box-shadow:0 4px 20px #e8c06a44}
.pound{font:700 13px Cinzel,serif;color:var(--gold);background:#e8c06a14;border:1px solid #e8c06a44;padding:7px 14px;border-radius:999px}
#pseudo{width:120px}
#mst{flex-basis:100%;text-align:center;color:var(--gold);min-height:18px;font-size:12px}
select,input[type=number],#pseudo{font:400 13px Sora,sans-serif;color:var(--ink);background:#ffffff0d;border:1px solid var(--line);padding:7px 11px;border-radius:10px;max-width:100%}
#pseudo{border-radius:999px}
select option{background:#12131f}
.act{font:600 13px Sora,sans-serif;color:var(--ink);background:var(--glass);border:1px solid var(--line);padding:11px 22px;border-radius:12px;transition:.2s}
.act:hover:not(:disabled){border-color:#ffffff55;transform:translateY(-1px)}
.act:disabled{opacity:.45;cursor:default}
.act.big{font:700 15px Cinzel,serif;letter-spacing:.08em;padding:16px 38px;border:0;border-radius:14px;color:#1a0c04;background:linear-gradient(120deg,var(--gold2),var(--gold) 55%,#d4783a);box-shadow:0 10px 38px #c8203c55;animation:glow 2.6s ease-in-out infinite alternate}
.act.big:disabled{animation:none;background:#ffffff12;color:var(--mute);box-shadow:none;opacity:1}
@keyframes glow{to{box-shadow:0 10px 56px #c8203caa}}
#draw{text-align:center}
#hint{min-height:28px;color:var(--fog);margin-top:30px;font:italic 500 19px 'Cormorant Garamond',serif}
.row{display:flex;gap:26px;justify-content:center;flex-wrap:wrap;margin:22px 0 30px;min-height:330px}
.btns{display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap}
.card{width:204px;aspect-ratio:2/3;perspective:1100px;border:0;background:none;padding:0;position:relative;transform:perspective(900px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .15s ease-out}
.row .card{animation:deal .75s cubic-bezier(.2,.8,.2,1) both}
.row .card:nth-child(2){animation-delay:.12s}.row .card:nth-child(3){animation-delay:.24s}
@keyframes deal{from{opacity:0;transform:translateY(80px) scale(.8) rotate(-7deg)}}
.in{position:absolute;inset:0;transition:transform .9s cubic-bezier(.3,.7,.3,1);transform-style:preserve-3d}
.card.up .in{transform:rotateY(180deg)}
.face,.back{position:absolute;inset:0;border-radius:14px;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden}
.back{background:radial-gradient(circle at 50% 42%,#2b2e48,#090a15 72%);box-shadow:inset 0 0 0 1px #e8c06a66,inset 0 0 0 7px #090a15,inset 0 0 0 8px #e8c06a44,0 18px 44px #000b;display:flex;align-items:center;justify-content:center}
.back::before{content:"";position:absolute;width:66%;aspect-ratio:1;border-radius:50%;background:conic-gradient(#e8c06a00,var(--gold),var(--blood),#e8c06a00 62%);-webkit-mask:radial-gradient(circle,transparent 62%,#000 63% 66%,transparent 67%);mask:radial-gradient(circle,transparent 62%,#000 63% 66%,transparent 67%);animation:spin 9s linear infinite}
.back::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,#ffffff06 0 2px,transparent 2px 14px)}
.back b{position:relative;z-index:1;font:900 54px Cinzel,serif;background:linear-gradient(#fff,var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 16px #e8c06a88)}
@keyframes spin{to{transform:rotate(360deg)}}
.face{transform:rotateY(180deg);background:#080911;box-shadow:inset 0 0 0 1.5px var(--rc),inset 0 0 0 6px #080911,inset 0 0 0 7px color-mix(in srgb,var(--rc) 55%,transparent),0 18px 44px #000c}
.face::before{content:"";position:absolute;inset:0;z-index:4;pointer-events:none;background:linear-gradient(115deg,#0000 40%,#ffffff2a 50%,#0000 60%);transform:translateX(-120%)}
.card[data-r=l] .face::before,.card[data-r=m] .face::before{animation:sweep 3.4s ease-in-out infinite}
@keyframes sweep{to{transform:translateX(120%)}}
.arch{position:absolute;inset:9px 9px 62px;border-radius:90px 90px 8px 8px;overflow:hidden;background:radial-gradient(circle at 50% 36%,var(--rg),#07080f 88%) center/cover;box-shadow:0 0 0 1px color-mix(in srgb,var(--rc) 70%,transparent)}
.arch svg{width:100%;height:100%;display:block}
.arch::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#0000 55%,#07080fcc 100%)}
.num{position:absolute;top:14px;left:0;right:0;text-align:center;z-index:2;font:700 10px Cinzel,serif;color:#fff;opacity:.85;letter-spacing:.3em;text-shadow:0 1px 8px #000}
.plate{position:absolute;left:9px;right:9px;bottom:9px;height:56px;z-index:2;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;border-radius:6px 6px 10px 10px;background:linear-gradient(#0d0e1a,#06070d);border:1px solid color-mix(in srgb,var(--rc) 60%,transparent);padding:0 6px}
.nm{font:700 12.5px/1.1 Cinzel,serif;color:#fff;letter-spacing:.03em}
.ds{font:italic 500 11.5px 'Cormorant Garamond',serif;color:#c9c7dc;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.seq{position:absolute;top:30px;left:50%;transform:translateX(-50%);z-index:2;font:700 8.5px Sora,sans-serif;letter-spacing:.06em;color:#0a0a12;background:var(--rc);padding:2px 10px;border-radius:999px;white-space:nowrap;max-width:88%;overflow:hidden;text-overflow:ellipsis}
.face.new::after{content:"Nouvelle";position:absolute;top:60px;right:14px;z-index:5;background:var(--blood);color:#fff;font:700 9px Sora,sans-serif;padding:2px 8px;border-radius:999px;box-shadow:0 0 14px #c8203c}
.shine{position:absolute;inset:0;z-index:3;pointer-events:none;opacity:0;transition:opacity .2s;background:radial-gradient(circle at var(--mx,50%) var(--my,50%),#ffffff44,#fff0 42%)}
.card:hover .shine{opacity:1}
.card[data-r=e] .shine,.card[data-r=l] .shine,.card[data-r=m] .shine{background:radial-gradient(circle at var(--mx,50%) var(--my,50%),#ffffff3a,#fff0 40%),linear-gradient(115deg,#0000 18%,#ff3dd248 33%,#3dffe848 50%,#ffe03d48 66%,#0000 82%);background-size:100% 100%,260% 260%;background-position:0 0,var(--mx,50%) var(--my,50%);mix-blend-mode:screen}
.card[data-r=l] .face{box-shadow:inset 0 0 0 1.5px var(--rc),inset 0 0 0 6px #080911,inset 0 0 0 7px #e0ac4588,0 0 34px #e8c06a44,0 18px 44px #000c}
.card[data-r=m] .face{animation:aura 3s ease-in-out infinite alternate}
@keyframes aura{from{box-shadow:inset 0 0 0 1.5px var(--rc),inset 0 0 0 6px #080911,0 0 24px #c8203c66}to{box-shadow:inset 0 0 0 1.5px var(--rc),inset 0 0 0 6px #080911,0 0 60px #c8203ccc}}
.card.glow.up{animation:pop 1.2s ease-out}
@keyframes pop{0%{filter:brightness(2.8) saturate(1.6)}100%{filter:none}}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:20px;margin-top:22px}
.grid .card{width:100%}.grid .in{transform:rotateY(180deg)}.grid .card:hover{z-index:2}
.empty{position:absolute;inset:0;border:1px dashed #ffffff22;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--mute);font-size:11px;background:#ffffff05;text-align:center}
.empty b{font:700 22px Cinzel,serif;color:#ffffff2a}
.qty{position:absolute;top:-8px;left:-8px;z-index:6;background:linear-gradient(120deg,var(--gold2),var(--gold));color:#1a0c04;border-radius:999px;padding:1px 10px;font:700 12px Sora,sans-serif}
.stat{display:flex;align-items:center;gap:16px;justify-content:center;font:700 18px Cinzel,serif;margin-top:26px}
.bar{flex:0 1 320px;height:7px;background:#ffffff12;border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--gold),var(--blood))}
.filters{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:12px}
.filters button{font:600 11.5px Sora,sans-serif;color:var(--mute);background:var(--glass);border:1px solid var(--line);padding:5px 13px;border-radius:999px}
.filters button[aria-pressed=true]{color:var(--gold);border-color:#e8c06a88;background:#e8c06a12}
.panel{background:var(--glass);border:1px solid var(--line);border-radius:18px;backdrop-filter:blur(14px);padding:18px 20px;margin:18px 0}
.panel>b{font:700 16px Cinzel,serif;color:var(--gold2);letter-spacing:.06em}
.lot{display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap;border-left:3px solid var(--rc);background:#ffffff07;border-radius:10px;padding:8px 14px;margin:8px 0;font-size:13px}
.lot i{color:var(--mute);font-size:11px;font-style:normal}
.lot button{font:600 12px Sora,sans-serif;background:#e8c06a16;border:1px solid #e8c06a66;padding:5px 12px;border-radius:8px;color:var(--gold)}
.mute{color:var(--mute)}.hide{display:none}
.foot{text-align:center;margin-top:44px}
.foot button.act{margin-bottom:12px}
.foot button:not(.act){background:none;border:0;color:var(--mute);text-decoration:underline;font-size:12px}
dialog{background:#0e0f1a;border:1px solid var(--line);border-radius:20px;color:var(--ink);padding:24px;text-align:center;max-width:94vw}
dialog::backdrop{background:#000d;backdrop-filter:blur(6px)}
dialog .card{width:min(290px,70vw);margin:0 auto 20px;cursor:default}
.ds.s{font:600 8.5px Sora,sans-serif;letter-spacing:.02em;color:#d9d6ea;font-style:normal}.lv{position:absolute;top:9px;right:13px;z-index:3;font:700 9px Sora,sans-serif;color:var(--gold);text-shadow:0 0 6px #000}#ddet{max-width:300px;margin:0 auto 16px;font-size:13px}#ddet p{margin:6px 0}#pity b{color:var(--gold)}
.fx{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;pointer-events:none;background:radial-gradient(circle,#e0ac4577,#000c 70%);animation:fxo 1.7s ease-out forwards}.fx.m{background:radial-gradient(circle,#d0334acc,#000e 70%);animation-duration:2.3s}.fx i{position:absolute;width:140vmax;height:140vmax;border-radius:50%;background:repeating-conic-gradient(#ffe0a133 0 6deg,transparent 6deg 20deg);-webkit-mask:radial-gradient(circle,#000,transparent 60%);mask:radial-gradient(circle,#000,transparent 60%);animation:fxr 2.3s linear}.fx.m i{background:repeating-conic-gradient(#ff3d5a44 0 6deg,transparent 6deg 20deg)}.fx span{position:relative;font:900 clamp(26px,8vw,64px) Cinzel,serif;letter-spacing:.2em;color:var(--gold2);text-shadow:0 0 40px #e0ac45;animation:fxs 1.2s cubic-bezier(.2,1.4,.3,1)}.fx.m span{color:#ffd0d6;text-shadow:0 0 50px #d0334a}@keyframes fxo{0%{opacity:0}12%{opacity:1}75%{opacity:1}100%{opacity:0}}@keyframes fxr{to{transform:rotate(90deg)}}@keyframes fxs{from{transform:scale(.3);opacity:0;letter-spacing:.6em}}
.row.multi{min-height:0;gap:12px}.multi .card{width:112px}.multi .nm{font-size:9px}.multi .ds.s{font-size:7px}.multi .plate{height:44px}.multi .arch{bottom:48px}.row.moon1 .back{box-shadow:inset 0 0 0 1px #e8c06a,0 0 36px #e8c06a77}.row.moon2 .back{box-shadow:inset 0 0 0 1px #ff3d5a,0 0 44px #d0334acc}.bm{font-family:Cinzel,serif;color:#ff6b83;text-shadow:0 0 18px #d0334a}.bf{font-family:Cinzel,serif;color:var(--gold2);text-shadow:0 0 18px #e0ac45}
.arena{display:flex;align-items:flex-start;justify-content:center;gap:12px;margin:18px 0}.side{display:flex;flex-direction:column;align-items:center;gap:8px;width:min(150px,38vw)}.arena .card{width:min(140px,36vw)}.arena .fcard{animation:enter .5s cubic-bezier(.2,.8,.2,1)}@keyframes enter{from{opacity:0;transform:translateY(40px) scale(.8)}}.vs{font:900 22px Cinzel,serif;color:var(--blood);text-shadow:0 0 20px #c8203c;align-self:center}.hb{width:100%;height:8px;background:#ffffff14;border-radius:99px;overflow:hidden}.hb i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#d0334a,#e8c06a);transition:width .35s}.hv{font:600 11px Sora,sans-serif;color:var(--mute)}.tm{display:flex;gap:4px;flex-wrap:wrap;justify-content:center;min-height:22px}.pp{font:600 9px Sora,sans-serif;padding:2px 7px;border-radius:99px;background:#ffffff0d;color:var(--mute)}.pp.on{color:var(--gold);outline:1px solid #e8c06a88}.pp.dead{text-decoration:line-through;opacity:.4}.fc{position:relative;min-height:min(210px,54vw)}.fl{position:absolute;left:50%;top:30%;z-index:9;font:900 24px Cinzel,serif;pointer-events:none;white-space:nowrap;animation:fl .9s ease-out forwards;text-shadow:0 2px 10px #000}.fl.ht{color:#ff5470}.fl.hl{color:#6ff0a0}.fl.ms{color:#cfd3ff;font-size:17px}.fl.cr{color:#ffd45c;font-size:30px}@keyframes fl{from{transform:translate(-50%,0) scale(.6)}to{transform:translate(-50%,-70px) scale(1.2);opacity:0}}.fres{text-align:center;font:900 clamp(28px,7vw,52px) Cinzel,serif;letter-spacing:.2em;animation:fxs 1s}.fres.w{color:var(--gold2);text-shadow:0 0 36px #e8c06a}.fres.l{color:#ff6b83;text-shadow:0 0 36px #d0334a}
@media (max-width:560px){.card{width:152px}.row{gap:12px;min-height:240px}.grid{gap:14px}.nm{font-size:10.5px}.plate{height:48px}.arch{bottom:54px}}
@media (prefers-reduced-motion:reduce){.fog,.act.big,.back::before,.card[data-r=m] .face,.row .card,.card.glow.up{animation:none}.in{transition:none}}
</style>
</head>
<body>
<div id="bg" aria-hidden="true"><svg viewBox="0 0 1000 600" preserveAspectRatio="xMidYMax slice">
<defs><linearGradient id="sk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#07080e"/><stop offset=".6" stop-color="#191b28"/><stop offset="1" stop-color="#383b4a"/></linearGradient><radialGradient id="mn"><stop offset="0" stop-color="#d0334a"/><stop offset=".55" stop-color="#8a1a2b"/><stop offset="1" stop-color="#8a1a2b00"/></radialGradient></defs>
<rect width="1000" height="600" fill="url(#sk)"/>
<g fill="#e6dcc3" opacity=".55"><circle cx="90" cy="60" r="1.4"/><circle cx="240" cy="120" r="1"/><circle cx="430" cy="50" r="1.3"/><circle cx="560" cy="140" r="1"/><circle cx="670" cy="70" r="1.5"/><circle cx="900" cy="230" r="1"/><circle cx="150" cy="230" r="1.2"/><circle cx="350" cy="190" r="1"/></g>
<circle cx="780" cy="170" r="190" fill="url(#mn)" opacity=".6"/><circle cx="780" cy="170" r="58" fill="#b32239"/>
<g fill="none" stroke="#e8c06a" opacity=".13"><circle cx="190" cy="220" r="130" stroke-dasharray="10 6" stroke-width="12"/><circle cx="190" cy="220" r="76" stroke-width="1.5"/></g>
<path fill="#06070c" d="M0 600V470l40-8v-40l10-16 10 16v36h30v-60l12-24 12 24v70h40v-30h24v-70l16-30 16 30v100h46v-50l20-60 20 60v50h40V450h30v-40l14-30 14 30v70h60v-90l18-40 18 40v90h50v-40h30v-80l10-20 10 20v80h38v-50l16-36 16 36v50h60v-60h26v-90l8-24 8 24v90h26v50h50v-70l14-34 14 34v70h60v-40l24-6 24 6v60z"/>
<g fill="#ffc861"><circle cx="110" cy="452" r="2"/><circle cx="470" cy="440" r="2"/><circle cx="640" cy="446" r="2"/><circle cx="880" cy="452" r="2"/></g>
</svg><div id="fan"></div></div>
<div class="fog"></div><div class="fog b"></div>
<div class="wrap">
<header>
  <span class="sig" aria-hidden="true">0</span>
  <h1>SEFIRAH CASTLE</h1>
  <p class="sub">Prie le Fou, et que la brume grise t’accorde ses cartes.</p>
  <nav aria-label="Navigation">
    <button id="tDraw" aria-pressed="true">Le Tirage</button>
    <button id="tCol" aria-pressed="false">Le Grimoire</button>
    <button id="tMk" aria-pressed="false">Le Marché</button>
    <button id="tFt" aria-pressed="false">Le Combat</button>
    <button id="tRk" aria-pressed="false">Classements</button><button id="tIx" aria-pressed="false">Index</button>
    <span class="pound" id="pd">0 £</span>
    <input id="pseudo" placeholder="Ton pseudo" maxlength="20" aria-label="Pseudo">
    <button id="bgb">Mon fond</button><input type="file" id="bgf" accept="image/*" hidden>
    <span id="mst" aria-live="polite"></span>
  </nav>
</header>

<section id="draw">
  <p id="hint">Trois cartes attendent dans la brume.</p>
  <div class="row" id="pack"></div>
  <div class="btns"><button class="act big" id="open">Prier le Fou ×1</button><button class="act" id="o5">×5</button><button class="act" id="o10">×10</button><button class="act" id="buy">Offrir un tribut (15 £)</button><button class="act" id="all" style="display:none">Tout révéler</button></div><p id="stk" class="mute" style="margin-top:20px"></p><p id="pity" class="mute"></p><p class="btns"><button class="act" id="dbtn"></button></p>
</section>

<section id="col" class="hide">
  <div class="stat"><span id="count"></span><div class="bar"><i id="fill" style="width:0"></i></div></div>
  <div class="filters" id="fk"></div>
  <div class="filters" id="fr"></div>
  <div class="grid" id="grid"></div>
  <div class="foot"><p class="btns"><button class="act" id="sell">Vendre les doublons inutiles</button></p><button id="reset">Effacer ma collection</button></div>
</section>
<section id="mk" class="hide"><div id="mkw"></div></section>
<section id="ft" class="hide"><div id="ftw"></div></section>
<section id="rk" class="hide"><div id="rkw"></div></section><section id="ix" class="hide"><div id="ixw"></div></section>
</div>

<dialog id="dlg"><div id="dcard"></div><div id="ddet"></div>
<div class="btns"><button class="act" id="dlv">Améliorer</button><button class="act" id="dup">Ajouter mon image</button><button class="act" id="drm">Retirer l’image</button><button class="act" id="dcl">Fermer</button></div>

function rIx(){mz();const bar=(v,m)=>`<div class='bar' style='flex:1 1 90px'><i style='width:${Math.min(100,v/m*100)}%'></i></div>`;const col=(got,ok)=>got?'#5a4a2a':ok?'#e8c06a':'#a4a49c';const mis=(t,L,o)=>L.map(([k,m,tx,g],j)=>{const v=Math.min(o[k],m),got=o.c>>j&1,ok=v>=m,rw=`+${g} £${t==='w'?' · +1 booster':''}`;return `<div class='lot' style='--rc:${col(got,ok)}'><span>${tx}</span>${bar(v,m)}<span class='mute'>${v}/${m}</span>${got?'<i>✓ récupérée</i>':ok?`<button data-c='${t}${j}'>${rw}</button>`:`<i>${rw}</i>`}</div>`}).join('');const cm=CM.map(([n,f,o],j)=>{const got=(S.cm||0)>>j&1,ok=f();return `<div class='lot' style='--rc:${col(got,ok)}'><span>${n}</span><span class='mute'>${fmt(o)}</span>${got?'<i>✓ actif</i>':ok?`<button data-c='m${j}'>Récupérer</button>`:'<i>à accomplir</i>'}</div>`}).join('');const bn=S.bn||{a:0,d:0,p:0};$('ixw').innerHTML=`<div class='panel'><b>Missions du jour</b>${mis('d',DM,S.dm)}</div><div class='panel'><b>Missions de la semaine</b>${mis('w',WM,S.wm)}</div><div class='panel'><b>Missions de collection</b> <span class='mute'>Bonus permanents : ATQ +${bn.a} % · DEF +${bn.d} % · PV +${bn.p} %</span>${cm}</div><div class='panel'><b>Synergies</b> <span class='mute'>Place ces cartes ensemble dans ton équipe. Chaque carte du groupe au-delà du minimum ajoute à nouveau le bonus.</span>${SYN.map(([n,g,m,o,d])=>`<div class='lot' style='--rc:#5a4a2a'><span><b>${n}</b> <i>${d}</i></span><span class='mute'>${m}+ cartes : ${fmt(o)}</span></div>`).join('')}</div>`}
function claim(c){mz();const t=c[0],j=+c.slice(1);if(t==='m'){const m=CM[j];if(!m[1]()||((S.cm||0)>>j&1))return;S.cm=(S.cm||0)|(1<<j);S.bn=S.bn||{a:0,d:0,p:0};for(const k in m[2])S.bn[k]=(S.bn[k]||0)+m[2][k];msg('Bonus permanent obtenu !')}else{const o=t==='d'?S.dm:S.wm,m=(t==='d'?DM:WM)[j];if(o[m[0]]<m[1]||(o.c>>j&1))return;o.c|=1<<j;S.gold+=m[3];if(t==='w')S.st=(S.st||0)+1;msg('Récompense : +'+m[3]+' £')}save();rIx();tick()}
function mk(ids,loc,bo,lm,bn){const L=LB[loc]||['',0],f=k=>1+((L[0]===k||L[0]==='all')?L[1]/100:0),au=ids.some(i=>st(i,lm).ab==='aura'),y=syn(ids).o,B=bn||{a:0,d:0,p:0},g=k=>1+((y[k]||0)+(B[k]||0))/100;return ids.map(i=>{const s=st(i,lm),m=Math.round(s.p*f('hp')*g('p')*bo);return{i,n:CARDS[i][0],k:CARDS[i][4],ab:s.ab,a:s.a*f('atk')*(au?1.1:1)*g('a')*bo,d:s.d*f('def')*(s.ab==='fort'?1.25:1)*g('d')*bo,mx:m,hp:m,sh:s.ab==='shield'}})}
function sim(A,B,E){const U=[A,B];let t=0;while(A.hp>0&&B.hp>0&&t<40){t++;for(const s of [0,1]){const x=U[s],y=U[1-s];if(x.hp<=0||y.hp<=0)break;const at=x.a*(x.ab==='rage'&&x.hp<x.mx/2?1.4:1)*(AF[x.k]===y.k?1.15:1)*(.85+Math.random()*.3);let dm=Math.max(at*.15,at-y.d*(x.ab==='pierce'?.4:1)*.5);if(Math.random()<.08+(y.ab==='dodge'?.22:0)){E.push({k:'miss',s,w:'Esquive'});continue}if(y.sh){y.sh=false;E.push({k:'miss',s,w:'Bloqué'});continue}const cr=Math.random()<.1+(x.ab==='crit'?.2:0);if(cr)dm*=1.8;dm=Math.round(dm);y.hp=Math.max(0,y.hp-dm);E.push({k:'hit',s,dm,cr,hp:Math.round(y.hp)});if(x.ab==='drain'){const h=Math.round(dm*.3);x.hp=Math.min(x.mx,x.hp+h);E.push({k:'heal',s,v:h,hp:Math.round(x.hp)})}if(y.ab==='thorns'){const r=Math.round(dm*.25);x.hp=Math.max(0,x.hp-r);E.push({k:'dot',s,dm:r,hp:Math.round(x.hp)})}}U.forEach((u,s)=>{if(u.ab==='regen'&&u.hp>0&&u.hp<u.mx){const h=Math.round(u.mx*.07);u.hp=Math.min(u.mx,u.hp+h);E.push({k:'heal',s,v:h,hp:Math.round(u.hp)})}})}if(A.hp>0&&B.hp>0)(A.hp/A.mx<B.hp/B.mx?A:B).hp=0;return A.hp>0}
let SKP=false,fighting=false;const sl=ms=>new Promise(r=>setTimeout(r,SKP?0:ms)),SH=[{transform:'translateX(0)'},{transform:'translateX(-9px)',filter:'brightness(2.2)'},{transform:'translateX(9px)'},{transform:'translateX(0)'}];
async function play(A,B,E){SKP=false;const f=s=>$('f'+s),mx=[1,1],dd=[0,0],T=[A,B];const pips=()=>[0,1].forEach(s=>{$('t'+s).innerHTML=T[s].map((u,j)=>`<span class='pp${j<dd[s]?' dead':j===dd[s]?' on':''}'>${esc(u.n)}</span>`).join('')});const hp=(s,h)=>{$('h'+s).style.width=Math.max(0,h/mx[s]*100)+'%';$('v'+s).textContent=Math.max(0,h)+' / '+mx[s]};const fl=(s,tx,c)=>{const d=document.createElement('div');d.className='fl '+c;d.textContent=tx;f(s).appendChild(d);setTimeout(()=>d.remove(),900)};const an=(s,k,o)=>{const c=f(s).firstChild;if(c&&c.animate)c.animate(k,o)};pips();for(const e of E){const s=e.s;if(e.k==='in'){mx[s]=e.mx;const c=el(e.i,{up:true});c.classList.add('fcard');f(s).innerHTML='';f(s).appendChild(c);hp(s,e.h);pips();await sl(700)}else if(e.k==='hit'||e.k==='miss'){an(s,[{transform:'translateX(0)'},{transform:`translateX(${s?-60:60}px) scale(1.08)`},{transform:'translateX(0)'}],{duration:360,easing:'ease-out'});await sl(200);if(e.k==='miss')fl(1-s,e.w,'ms');else{an(1-s,SH,{duration:300});fl(1-s,(e.cr?'CRIT ':'')+'-'+e.dm,e.cr?'cr':'ht');hp(1-s,e.hp)}await sl(e.cr?650:480)}else if(e.k==='heal'){fl(s,'+'+e.v,'hl');hp(s,e.hp);await sl(300)}else if(e.k==='dot'){an(s,SH,{duration:300});fl(s,'-'+e.dm,'ht');hp(s,e.hp);await sl(380)}else if(e.k==='ko'){const c=f(s).firstChild;if(c){c.style.filter='grayscale(1) brightness(.5)';c.animate([{opacity:1},{opacity:.12,transform:'translateY(26px) scale(.9)'}],{duration:600,fill:'forwards'})}dd[s]++;pips();await sl(750)}}}
function rFt(){if(fighting)return;const all=CARDS.map((_,i)=>i),ids=all.filter(i=>S.own[i]&&CARDS[i][4]!=='l'),ls=all.filter(i=>S.own[i]&&CARDS[i][4]==='l');const sel=k=>`<select data-t='${k}' aria-label='Carte ${k+1}'>${ids.map(i=>`<option value='${i}'${i===(ids.includes(S.team[k])?S.team[k]:ids[k])?' selected':''}>${esc(CARDS[i][0])} (${pwr(i)})</option>`).join('')}</select>`;$('ftw').innerHTML=`<div class='panel'><b>Ton équipe</b> <span class='mute'>3 combattants dans l’ordre : chacun se bat jusqu’à sa chute. Elle défend aussi contre les autres joueurs.</span><p class='btns'>${sel(0)}${sel(1)}${sel(2)}<select data-l aria-label='Lieu'><option value='-1'>Aucun lieu</option>${ls.map(i=>`<option value='${i}'${S.loc===i?' selected':''}>${esc(CARDS[i][0])} · ${LBT[i]}</option>`).join('')}</select></p><p id='syp' class='mute'></p><p class='mute'>Avantages (+15 % ATQ) : Voie du Fou › Divinités › Personnages › Voie du Fou</p><p class='btns'><button class='act' id='f1'>Défier un joueur</button><button class='act' id='f2'>Défier la brume (PNJ)</button></p><div id='stage'></div><p><b>${tit(S.pts)}</b> · ${S.pts} pts · ${S.w} V · ${S.l} D · série ${S.ws||0}</p><div id='flog'>${FL}</div></div>`;synp()}
async function fight(pvp){if(fighting)return;const wait=10000-(Date.now()-S.lf);if(wait>0)return msg('Reprends ton souffle ('+Math.ceil(wait/1000)+' s).');const t=[...document.querySelectorAll('[data-t]')].map(s=>+s.value),lo=+((document.querySelector('[data-l]')||{value:-1}).value);if(t.length<3||new Set(t).size<3||t.some(x=>isNaN(x)))return msg('Il te faut 3 cartes différentes.');let opp,on,ol=-1,olv,obn,bo=1;if(pvp){const c=PL.filter(p=>p.id!==uid&&p.team&&p.team.length===3);if(!c.length)return msg('Aucun joueur n’a encore d’équipe. Essaie le PNJ.');const p=c[Math.floor(Math.random()*c.length)];opp=p.team.map(i=>CARDS[i][4]==='l'?pc():i);on=p.name||'Voyageur';ol=p.loc===undefined?-1:p.loc;olv=p.lv;obn=p.bn}else{opp=[pc(),pc(),pc()];on='la brume grise';bo=1+Math.min(.5,S.pts/1500)}S.team=t;S.loc=lo;S.lf=Date.now();const A=mk(t,lo,1,null,S.bn),B=mk(opp,ol,bo,olv,obn),E=[],lg=[];let a=0,b=0;while(a<3&&b<3){const x=A[a],y=B[b],hx=Math.round(x.hp),hy=Math.round(y.hp);E.push({k:'in',s:0,i:x.i,h:hx,mx:x.mx},{k:'in',s:1,i:y.i,h:hy,mx:y.mx});const w=sim(x,y,E);E.push({k:'ko',s:w?1:0});lg.push(`${esc(x.n)} (${hx} PV) ${w?'terrasse':'tombe face à'} ${esc(y.n)} (${hy} PV) · reste ${Math.round(w?x.hp:y.hp)} PV`);w?b++:a++}const win=a<3,perf=win&&a===0;let gp=pvp?20:8,gg=pvp?8:3,lp=pvp?10:4,tx;ev('fight');if(win){ev('win');S.ws=(S.ws||0)+1;gp=Math.round(gp*(perf?1.5:1));gg+=Math.min(S.ws-1,5)*2;S.w++;S.pts+=gp;S.gold+=gg;tx=`+${gp} pts, +${gg} £${perf?' · victoire parfaite !':''}${S.ws>1?' · série de '+S.ws:''}`}else{S.ws=0;S.l++;S.pts=Math.max(0,S.pts-lp);tx=`−${lp} pts`}FL=`<p><b>${win?'Victoire':'Défaite'} contre ${esc(on)}</b></p>`+lg.map(o=>`<div class='lot' style='--rc:#5a4a2a'>${o}</div>`).join('')+`<p class='mute'>${tx}</p>`;fighting=true;$('stage').innerHTML=`<div class='arena'><div class='side'><div class='tm' id='t0'></div><div class='fc' id='f0'></div><div class='hb'><i id='h0'></i></div><div class='hv' id='v0'></div></div><div class='vs'>VS</div><div class='side'><div class='tm' id='t1'></div><div class='fc' id='f1'></div><div class='hb'><i id='h1'></i></div><div class='hv' id='v1'></div></div></div><p class='btns'><button class='act' id='skip'>Passer</button></p>`;$('skip').onclick=()=>{SKP=true};$('stage').scrollIntoView({behavior:'smooth',block:'center'});save();await play(A,B,E);SKP=false;$('stage').insertAdjacentHTML('beforeend',`<div class='fres ${win?'w':'l'}'>${win?'VICTOIRE':'DÉFAITE'}</div>`);await sl(1600);fighting=false;rFt()}
function rRk(){
  const L=db?PL.slice():[{id:"me",name:nm(),pts:S.pts,w:S.w,l:S.l,n:cnt()}];
  const tab=(t,arr,f)=>`<div class="panel"><b>${t}</b>${arr.slice(0,20).map((p,k)=>`<div class="lot" style="--rc:${p.id===uid||p.id==="me"?"#e8c06a":"#5a4a2a"}"><span>${k+1}. ${esc(p.name||"Voyageur")}</span><span>${f(p)}</span></div>`).join("")}</div>`;
  $("rkw").innerHTML=tab("Combat",L.slice().sort((a,b)=>(b.pts||0)-(a.pts||0)),p=>`${tit(p.pts||0)} · ${p.pts||0} pts · ${p.w||0} V / ${p.l||0} D`)+tab("Collection",L.slice().sort((a,b)=>(b.n||0)-(a.n||0)),p=>`${p.n||0} / ${CARDS.length}`);
}
const TABS={draw:"tDraw",col:"tCol",mk:"tMk",ft:"tFt",rk:"tRk",ix:"tIx"};
function show(v){curTab=v;for(const k in TABS){$(k).classList.toggle("hide",k!==v);$(TABS[k]).setAttribute("aria-pressed",k===v)}refresh(true)}
function refresh(force){
  if(!force&&(curTab==="mk"||curTab==="ft")&&$(curTab+"w").contains(document.activeElement))return;
  const f={col:renderCol,mk:rMk,ft:rFt,rk:rRk,ix:rIx}[curTab];if(f)f();
}
for(const k in TABS)$(TABS[k]).onclick=()=>show(k);
setInterval(()=>{if(db){settle();refresh()}},15000);
$("pseudo").onchange=()=>{S.name=$("pseudo").value.trim().slice(0,20);save();refresh(true)};
const BK="grimoire-fond";
function applyBg(){let u=null;try{u=localStorage.getItem(BK)}catch(e){}$("fan").style.backgroundImage=u?`url(${u})`:"";$("bgb").textContent=u?"Retirer mon fond":"Mon fond"}
$("bgb").onclick=()=>{let u=null;try{u=localStorage.getItem(BK)}catch(e){}if(u){try{localStorage.removeItem(BK)}catch(e){}applyBg()}else $("bgf").click()};
$("bgf").onchange=e=>{
  const f=e.target.files[0];if(!f)return;const im=new Image();
  im.onload=()=>{const c=document.createElement("canvas"),s=Math.min(1,1400/im.width);c.width=im.width*s;c.height=im.height*s;c.getContext("2d").drawImage(im,0,0,c.width,c.height);
    try{localStorage.setItem(BK,c.toDataURL("image/jpeg",.7))}catch(x){msg("Image trop lourde pour être gardée.")}applyBg();e.target.value=""};
  im.src=URL.createObjectURL(f);
};
applyBg();
document.addEventListener("pointermove",e=>{const c=e.target.closest&&e.target.closest(".card.up");if(!c||c.closest("dialog"))return;const r=c.getBoundingClientRect(),x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height;c.style.setProperty("--mx",x*100+"%");c.style.setProperty("--my",y*100+"%");c.style.setProperty("--rx",((.5-y)*16)+"deg");c.style.setProperty("--ry",((x-.5)*16)+"deg")});
document.addEventListener("pointerout",e=>{const c=e.target.closest&&e.target.closest(".card");if(c){c.style.removeProperty("--rx");c.style.removeProperty("--ry")}});
$("dbtn").onclick=()=>{const td=dayN();if(S.dd===td)return;S.ds=S.dd===td-1?(S.ds||0)+1:1;S.dd=td;const g=10+Math.min(S.ds,7)*5+(S.ds%7===0?30:0);S.gold+=g;save();msg(`Offrande du jour : +${g} £`)};
$("dlv").onclick=()=>{const s=st(cur),l=LV(cur);if(!s||l>=5||S.own[cur]-1<l)return;S.own[cur]-=l;S.lv=S.lv||{};S.lv[cur]=l+1;ev('up');save();openDlg(cur);renderCol()};
$('open').onclick=()=>openN(1);$('o5').onclick=()=>openN(5);$('o10').onclick=()=>openN(10);$('buy').onclick=()=>{if(S.gold<15)return;S.gold-=15;openN(1,1)};
$('all').onclick=()=>{const cs=[...document.querySelectorAll('#pack .card:not(.up)')],rs=cs.map(c=>c.dataset.r),b=rs.includes('m')?'m':rs.includes('l')?'l':'';fxOff=true;if(b)fx(b,1);cs.forEach((c,j)=>setTimeout(()=>{c.click();if(j===cs.length-1)setTimeout(()=>{fxOff=false},200)},j*140+(b?600:0)))};
$('ixw').addEventListener('click',e=>{const c=e.target.dataset&&e.target.dataset.c;if(c)claim(c)});
$('ftw').addEventListener('change',e=>{if(e.target.dataset.t!==undefined)synp()});
save();setInterval(tick,500);tick();
